# Hybrid graphics: keep NVIDIA Quadro dGPU asleep (D3cold/RTD3) unless an app
# explicitly offloads via `prime-run`. These MUST be set before Hyprland starts
# (wlroots reads WLR_DRM_DEVICES at backend init, before config parse).
#
# WLR_DRM_DEVICES: restrict Hyprland to the Intel iGPU + DisplayLink (evdi)
# devices only, excluding the NVIDIA dGPU (pci-0000:01:00.0).
#   i915  -> eDP-1 (internal panel)
#   evdi0 -> external Samsung #1 (DisplayLink)
#   evdi1 -> external Samsung #2 (DisplayLink)
WLR_DRM_DEVICES=/dev/dri/by-path/pci-0000:00:02.0-card,/dev/dri/by-path/platform-evdi.0-card,/dev/dri/by-path/platform-evdi.1-card

# Default GL apps to Mesa (Intel iGPU) for battery/temp. Override per-app with:
#   prime-run <app>   (sets __GLX_VENDOR_LIBRARY_NAME=nvidia + offload env)
__GLX_VENDOR_LIBRARY_NAME=mesa
